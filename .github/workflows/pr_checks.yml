name: PR Checks

# Runs the store's tests (npm test, Node's own test runner over
# scripts/*.test.mjs), the typecheck (next typegen, then tsc --noEmit) and
# next build on every pull request. None of them needs a credential or a
# .env, so the job has no secrets and runs for forks too.

on:
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces its run.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The tests run the store's TypeScript under plain Node, which needs
      # 22.18 or later. 24, as in the image.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # As the dockerfile installs them.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
